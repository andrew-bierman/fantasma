name: macOS release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release from VERSION
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-release

jobs:
  notarize:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    environment: macos-notarization
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test and build
        run: |
          swift test -q
          scripts/build-app.sh

      - name: Sign and notarize
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: '666HGMV2LU'
        run: |
          set -euo pipefail
          : "${CERTIFICATE:?Missing DEVELOPER_ID_P12_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing DEVELOPER_ID_P12_PASSWORD}"
          : "${APPLE_ID:?Missing APPLE_NOTARY_APPLE_ID}"
          : "${APPLE_PASSWORD:?Missing APPLE_NOTARY_PASSWORD}"

          umask 077
          keychain="$RUNNER_TEMP/fantasma-signing.keychain-db"
          certificate="$RUNNER_TEMP/fantasma-signing.p12"
          keychain_password="$(openssl rand -hex 32)"
          trap 'security delete-keychain "$keychain" || true; rm -f "$certificate"' EXIT
          printf '%s' "$CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"

          unset CERTIFICATE CERTIFICATE_PASSWORD
          scripts/notarize.sh
          codesign --verify --deep --strict Fantasma.app
          syspolicy_check distribution Fantasma.app

      - name: Package stapled app
        id: package
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_dir="$RUNNER_TEMP/Fantasma-$version"
          mkdir -p "$release_dir"
          ditto Fantasma.app "$release_dir/Fantasma.app"
          ditto -c -k --keepParent "$release_dir" "Fantasma-$version-arm64.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload signed ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fantasma-${{ steps.package.outputs.version }}-arm64
          path: Fantasma-${{ steps.package.outputs.version }}-arm64.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    if: inputs.publish
    needs: notarize
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Fantasma-${{ needs.notarize.outputs.version }}-arm64

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.notarize.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          status=0
          git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$tag" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Tag $tag already exists. Bump VERSION before publishing."
            exit 1
          fi
          [ "$status" -eq 2 ] || exit "$status"
          gh release create "$tag" "Fantasma-$VERSION-arm64.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fantasma $tag" --generate-notes
