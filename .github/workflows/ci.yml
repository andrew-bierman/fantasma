name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# macOS runners bill at 10x minutes — keep to one short job, cache the
# heavy XCFramework, skip GUI-dependent checks (those run locally).
# The group is namespaced to this workflow: a shared `ci-${{ github.ref }}`
# string let another workflow's run cancel build-test before it started.
concurrency:
  group: ci-build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM + XCFramework
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Bundle assembly
        run: scripts/build-app.sh
